# Render Blueprint — one-click deploy
# Place at the REPOSITORY ROOT so Render auto-detects it on import.
# It deploys the Node backend inside server/ automatically.
services:
  - type: web
    name: ogxisai-license
    runtime: node
    plan: free
    rootDir: server          # backend lives in server/
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      # SET THESE IN RENDER -> your service -> Environment
      - key: ADMIN_USER           # admin panel username (default "OG")
        value: OG
        sync: false
      - key: ADMIN_PASS           # admin panel password (default "OG@098") — CHANGE THIS
        value: OG@098
        sync: false
      - key: ADMIN_KEY            # returned after login; used as the admin token
        sync: false
      - key: SESSION_SECRET       # signs the license sessions
        sync: false
      - key: SEED_KEYS            # (optional) comma-separated keys recreated on boot
        sync: false