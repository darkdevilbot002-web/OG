<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGxISAI License Admin</title>
<style>
  *{box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui,sans-serif}
  body{margin:0;background:radial-gradient(1000px 520px at 50% -120px,#170a1c 0%,transparent 60%),#08080f;color:#e8e8f2;min-height:100vh}
  .wrap{max-width:980px;margin:0 auto;padding:30px 18px 70px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .logo{font-weight:900;font-size:26px;letter-spacing:6px;background:linear-gradient(120deg,#fff,#f87171);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{font-weight:600;font-size:11px;letter-spacing:2px;color:#8b8ba3;background:none;-webkit-text-fill-color:#8b8ba3;margin-left:6px}
  .sub{color:#9aa0b8;font-size:13px;line-height:1.6;margin-bottom:8px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  .legend{font-size:11px;color:#9aa0b8;display:inline-flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dt-bound{background:#7dd3fc;box-shadow:0 0 8px #38bdf8}
  .dt-unbound{background:#c4b5fd}
  .card{background:linear-gradient(180deg,rgba(20,22,38,.92),rgba(12,13,24,.92));border:1px solid #232642;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .card h2{font-size:13px;margin:0 0 16px;color:#fca5a5;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:9px}
  .card h2::before{content:'';width:9px;height:9px;border-radius:2px;background:linear-gradient(135deg,#dc2626,#f59e0b)}
  label{font-size:12px;color:#8b8ba3;display:block;margin:8px 0 4px}
  input,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #2b2f4d;background:#0b0c18;color:#fff;font-size:14px;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{outline:none;border-color:#ef4444;box-shadow:0 0 0 3px rgba(220,38,38,.15)}
  .login-card{max-width:420px;width:100%;margin:0}
  .centered{display:flex;align-items:center;justify-content:center;min-height:58vh;margin-bottom:10px}
  .login-card{max-width:420px;width:100%;margin:0}
  button{cursor:pointer;border:0;border-radius:10px;font-weight:700;padding:11px 14px;font-size:13px;letter-spacing:.5px;transition:filter .15s,transform .05s}
  button:active{transform:translateY(1px)}
  .btn-danger{background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;box-shadow:0 6px 18px rgba(239,68,68,.3)}
  .btn-danger:hover{filter:brightness(1.1)}
  .btn-ghost{background:#14162a;color:#cbd5e1;border:1px solid #2b2f4d}
  .btn-ghost:hover{background:#1d2038;border-color:#3a3f66}
  .seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .seg button{background:#0c0d1a;border:1px solid #262a45;color:#cbd5e1}
  .seg button:hover{background:#1a1d33}
  .hint{font-size:11px;color:#8b8ba3;margin-top:8px}
  .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
  .b-active{background:#0f3d22;color:#4ade80}
  .b-expired{background:#3b2508;color:#fbbf24}
  .b-revoked{background:#3d0a0a;color:#f87171}
  .d-bound{background:#12314a;color:#7dd3fc}
  .d-unbound{background:#2a2342;color:#c4b5fd}
  table{width:100%;border-collapse:collapse;font-size:13px;color:#dbe1f0;min-width:720px}
  thead th{text-align:left;color:#7b82a0;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:10px 8px;border-bottom:1px solid #262a45;white-space:nowrap}
  tbody td{padding:11px 8px;border-bottom:1px solid #16182a;vertical-align:middle}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .mono{font-family:'SF Mono',Consolas,monospace;font-size:12px;color:#93c5fd;letter-spacing:.5px}
  small{color:#6b7280}
  .refresh-note{font-size:11px;color:#6b7280;margin-top:10px}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#262a45;border-radius:6px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">OGxISAI<small>LICENSE ADMIN</small></div>
  </div>
  <div class="sub">
    <span>Mint keys → buyers enter them in the extension → all powers unlock. Revoked keys lose powers within ~1s. One key = one device.</span>
    <span class="legend"><span class="dot dt-bound"></span> Bound</span>
    <span class="legend"><span class="dot dt-unbound"></span> Unbound</span>
  </div>

  <div id="loginView" class="centered">
  <div class="card login-card">
    <h2>Admin login</h2>
    <div class="row">
      <div><label>Username</label><input id="admUser" value="OG" autocomplete="off"></div>
      <div><label>Password</label><input id="admPass" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')login()"></div>
      <div style="display:flex;flex-direction:column;justify-content:flex-end"><button class="btn-danger" onclick="login()">LOGIN</button></div>
    </div>
    <div class="hint" id="loginMsg">&nbsp;</div>
    <div class="hint"><span id="whoBar"></span> <button class="btn-ghost" id="logoutBtn" onclick="logout()" style="display:none;padding:6px 10px;font-size:12px">Logout</button></div>
  </div>
  </div><!-- /loginView -->

  <div class="protected hidden">

  <div class="card">
    <h2>Create new key</h2>
    <div class="row">
      <div>
        <label>Plan</label>
        <select id="plan"><option value="pro">pro (all powers)</option></select>
      </div>
      <div>
        <label>Duration (days)</label>
        <input id="days" type="number" min="0" placeholder="e.g. 10, 30, 0=unlimited">
      </div>
      <div>
        <label>Note / buyer</label>
        <input id="note" type="text" placeholder="optional buyer name">
      </div>
      <div style="display:flex;flex-direction:column;justify-content:flex-end">
        <button class="btn-danger" onclick="createKey()">CREATE KEY</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn-ghost" onclick="quick(10)">10 days</button>
      <button class="btn-ghost" onclick="quick(30)">30 days</button>
      <button class="btn-ghost" onclick="quick(0)">∞ unlimited</button>
      <button class="btn-ghost" onclick="loadKeys()">↻ Refresh list</button>
    </div>
    <div class="hint" id="makeMsg"></div>
  </div>

  <div class="card">
    <h2>Keys &amp; status</h2>
    <div class="row" style="margin-bottom:6px">
      <div><label>Filter keys</label><input id="keyFilter" type="text" placeholder="Search by key or buyer…" oninput="renderKeys()" disabled></div>
    </div>
    <div class="loading" id="listMsg">Loading…</div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>Key</th><th>Plan</th><th>Status</th><th>Created</th><th>Expires</th><th>Buyer</th><th>Device</th><th>Checks</th><th>Actions</th></tr></thead>
      <tbody id="keysBody"></tbody>
    </table>
    </div>
  </div>
  </div><!-- /protected -->
</div>
<script>
const base = location.origin;
function adm(){ return localStorage.getItem('ogx_adm')||''; }
function showProtected(on){ document.querySelectorAll('.protected').forEach(d=>d.classList.toggle('hidden',!on)); }
function afterAuth(){
  const on = !!adm();
  showProtected(on);
  const lv=document.getElementById('loginView');
  if(lv) lv.classList.toggle('hidden', on);
  const who = document.getElementById('whoBar');
  const lo = document.getElementById('logoutBtn');
  if (who) who.textContent = on ? ('Logged in as ' + (localStorage.getItem('ogx_adm_user')||'admin')) : 'Not logged in';
  if (lo) lo.style.display = on ? 'inline-block' : 'none';
}
function login(){
  const msg=document.getElementById('loginMsg');
  const user=document.getElementById('admUser').value.trim();
  const pass=document.getElementById('admPass').value;
  msg.className='hint'; msg.textContent='Logging in…';
  fetch(base+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})})
    .then(r=>r.json()).then(j=>{
      if(j.ok){
        localStorage.setItem('ogx_adm', j.token);
        localStorage.setItem('ogx_adm_user', user);
        msg.className='ok'; msg.textContent='Logged in.';
        afterAuth(); loadKeys();
      } else { msg.className='err'; msg.textContent=(j.error||'Invalid credentials.'); }
    }).catch(()=>{ msg.className='err'; msg.textContent='Server unreachable.'; });
}
function logout(){ localStorage.removeItem('ogx_adm'); localStorage.removeItem('ogx_adm_user'); document.getElementById('admPass').value=''; afterAuth(); }
window.onload=()=>{ afterAuth(); if(adm()) loadKeys(); };

function api(path, body){
  return fetch(base+path, {method:'POST', headers:{'Content-Type':'application/json','x-admin-key':adm()}, body: JSON.stringify(body||{})})
    .then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error); return j; });
}
function quick(d){ document.getElementById('days').value=d; }

async function createKey(){
  const m=document.getElementById('makeMsg');
  if(!adm()){ m.className='err'; m.textContent='Login on the admin panel first.'; return; }
  try{
    const days=parseInt(document.getElementById('days').value||'0',10);
    const r=await api('/api/keys',{plan:document.getElementById('plan').value, days, note:document.getElementById('note').value});
    m.className='ok';
    m.textContent='Created: '+r.key+(days>0?' ('+days+' days)': ' (lifetime)')+'   → send this to the buyer.';
    document.getElementById('days').value=''; document.getElementById('note').value='';
    loadKeys();
  }catch(e){ m.className='err'; m.textContent='Error: '+e.message; }
}

let KEY_CACHE=[];
async function loadKeys(){
  const msg=document.getElementById('listMsg');
  if(!adm()){ msg.textContent='Login to see keys.'; document.getElementById('keysBody').innerHTML=''; return; }
  msg.className='loading'; msg.textContent='Loading…';
  try{
    KEY_CACHE=(await (await fetch(base+'/api/keys',{headers:{'x-admin-key':adm()}})).json())||[];
    renderKeys();
    msg.className='hint'; msg.textContent=KEY_CACHE.length+' key(s) · auto-refresh every 15s';
    const f=document.getElementById('keyFilter'); if(f) f.disabled=false;
  }catch(e){ msg.className='err'; msg.textContent='Error: '+e.message; }
}
function renderKeys(){
  const q=(document.getElementById('keyFilter').value||'').toUpperCase().trim();
  const list = q ? KEY_CACHE.filter(k=>k.key.toUpperCase().includes(q)||(k.note||'').toUpperCase().includes(q)) : KEY_CACHE;
  const html=(list||[]).map(k=>{
    let st=k.status;
    if(!st || st==='?'){  // fallback: compute real status ourselves if the backend didn't send it
      st = (k.active===false) ? 'revoked' : (k.expiresAt && Date.now()>k.expiresAt ? 'expired' : 'active');
    }
    const badge='<span class="badge b-'+st+'">'+st.toUpperCase()+'</span>';
    const exp = k.expiresAt ? new Date(k.expiresAt).toLocaleString() : 'never';
    const devCell = k.deviceId
      ? '<span class="badge d-bound" title="'+k.deviceId+'"><span class="dot dt-bound"></span>BOUND</span>'
      : '<span class="badge d-unbound"><span class="dot dt-unbound"></span>UNBOUND</span>';
    const notes = k.note ? '<small title="'+k.note+'">'+k.note+'</small>' : '';
    const act='<div class="actions">'+
      '<button class="btn-ghost" onclick="copyKey(\''+k.key+'\')" title="Copy key">⧉</button>'+
      (st==='active' ? '<button class="btn-danger" onclick="revokeKey(\''+k.key+'\')">Revoke</button>' : (st==='revoked'?('<button class="btn-ghost" onclick="activateKey(\''+k.key+'\')">Activate</button>'):''))+
      '<button class="btn-ghost" onclick="delKey(\''+k.key+'\')" title="Delete">🗑</button>'+
      '</div>';
    return '<tr>'+
      '<td class="mono">'+k.key+'</td>'+
      '<td>'+k.plan+'</td>'+
      '<td>'+badge+'</td>'+
      '<td><small>'+new Date(k.createdAt||Date.now()).toLocaleDateString()+'</small></td>'+
      '<td><small>'+exp+'</small></td>'+
      '<td>'+notes+'</td>'+
      '<td>'+devCell+'</td>'+
      '<td><small>'+(k.verifications||0)+'</small></td>'+
      '<td>'+act+'</td></tr>';
  }).join('')||'<tr><td colspan="9"><small>No keys found.</small></td></tr>';
  document.getElementById('keysBody').innerHTML=html;
}
async function revokeKey(key){
  const m=document.getElementById('listMsg');
  if(!confirm('Revoke '+key+'? Buyer loses all powers within ~1s.')) return;
  try{ await api('/api/keys/revoke',{key}); m.className='ok'; m.textContent='Revoked '+key+' — powers off soon.'; loadKeys(); }
  catch(e){ m.className='err'; m.textContent='Error: '+e.message; }
}
async function activateKey(key){
  try{ await api('/api/keys/activate',{key}); loadKeys(); }
  catch(e){ const m=document.getElementById('listMsg'); m.className='err'; m.textContent='Error: '+e.message; }
}
function copyKey(key){
  const m=document.getElementById('listMsg');
  const done=()=>{ m.className='ok'; m.textContent='Copied '+key; setTimeout(()=>{ if(m.className==='ok') m.textContent=''; },2000); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(key).then(done).catch(()=>fallbackCopy(key)); }
  else fallbackCopy(key);
  function fallbackCopy(k){ const t=document.createElement('textarea'); t.value=k; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); done(); }catch(_){} t.remove(); }
}
async function delKey(key){
  const m=document.getElementById('listMsg');
  if(!confirm('Permanently DELETE '+key+'? This cannot be undone.')) return;
  try{ await api('/api/keys/delete',{key}); m.className='ok'; m.textContent='Deleted '+key; loadKeys(); }
  catch(e){ m.className='err'; m.textContent='Error: '+e.message; }
}
setInterval(loadKeys, 15000);
</script>
</body>
</html>
